# configs/v1-m3.toml — the M3 frozen configuration (M3 plan item 19).
#
# The file's SHA-256 is written on every manifest row as `config_hash`, and
# `analyse.py` refuses to pool rows whose hashes differ. Two rows under two
# different config files therefore carry two different hashes and can never be
# averaged together, which is the whole of "rows from different configs are never
# pooled" (§Versioning).
#
# Read it with `scripts/bugsinpy/frozen_config.py`. Four sections, four
# different kinds of statement:
#
#   [env]       frozen to a literal — the harness APPLIES it to the child
#               environment and REFUSES the run when the caller's own environment
#               sets one of these to a different value, unless `--allow-override`
#               is given (recorded on every row). The value "unset" is a frozen
#               value meaning "this variable must be absent".
#   [recorded]  part of the configuration, but only knowable at run time (or, for
#               the per-bug sandbox tree, only knowable per bug). The comment gives
#               the row/summary field that carries the observed value; the file
#               does not freeze a literal it cannot make true.
#   [prereg]    what the configuration commits to before a run.
#   [fixed_rounds]  the fixed-round arms and their K (M3 item 9). ENFORCED: the
#               harness reads it and refuses a run whose scheduled K arm it does
#               not declare. Inside the file's bytes, so K and the arm list are
#               both covered by `config_hash`.
#   [prompts]   the content hash of every prompt template, inside the hash above.
#
# [VANTA-WHY] Every value in [env] below is MEASURED, not chosen: it is the value
# the night1/night2 runs actually ran under, read off the `# env:` header that
# `runner.env_log_line` writes as line 2 of each run log. All fifteen night logs
# (night1 matplotlib_1 / pandas_1 / PySnooper_3, night2 pandas_1 / PySnooper_3)
# carry the same set apart from the per-bug checkpoint and pandas' extra memory
# key, so no variable had to be reconciled between runs. The two variables this
# file previously froze to other values — `VANTA_SAMPLING = "pinned"` and
# `VANTA_REASONING_EFFORT = "unset"` — were wrong: the smokes ran `coding` and
# `medium`, and `VANTA_LLM_CONTEXT_TOKENS`, previously frozen to `unset`, was set
# to 262144. `unset` there is not neutral: with the variable absent the binary
# falls back to 65536 on a hosted backend, which is roughly a quarter of the
# window the rows were sized against (prepare's own `n_ctx_source` names
# `VANTA_LLM_CONTEXT_TOKENS`).
#
# A variable the caller does not set is never an override — the harness applies
# this file's value instead — so freezing a literal both pins the child env and
# refuses a caller who exports a different one. Freezing `unset` is the opposite
# guard: it refuses a caller who exports the variable at all.

schema = 1
name = "v1-m3"

# ---------------------------------------------------------------------------
# [env] — frozen to the night-run literals. Applied to every vanta_m3 child; a
# caller value that differs is refused before the first VM boots.
# ---------------------------------------------------------------------------
[env]
# The arm, and the switches the arm's own `arms.py` entry derives from it. The
# harness also sets these itself (`runner.vanta_env`, from the ONE arm entry), and
# its keys are applied AFTER this file's — so the freeze is a guard on the caller:
# it refuses a shell that exports, say, `VANTA_ARM=b0` while claiming to run this
# configuration. `b3` is `on`/`on`/`off`/`off` for attacker/bate/judge/planner.
VANTA_ARM = "b3"
VANTA_ATTACKER = "on"
VANTA_BATE = "on"
VANTA_JUDGE = "off"
VANTA_PLANNER = "off"

# The endpoint and the model. Frozen rather than inherited: a different model is a
# different measurement, and `gpt-6-luna` is what every night row was taken under.
VANTA_LLM_BACKEND = "openai"
VANTA_LLM_MODEL = "gpt-6-luna"

# §1.6.1 — the window. 262144 is the value prepare's gate was sized against
# (`prepare.json`'s `n_ctx`, whose `n_ctx_source` is this variable's name) and the
# value every night row's prompts were budgeted against. Freezing it is what stops
# a shell with the variable absent from silently rerunning at the 65536 fallback.
VANTA_LLM_CONTEXT_TOKENS = "262144"

# §14.11 — the sampler. `coding` is the night setting; `pinned` is the per-site
# schedule the v0.2-era baselines used, and a different schedule is a different
# measurement.
VANTA_SAMPLING = "coding"

# §14.21 — the reasoning effort as sent, for every site including `intent_audit`.
# `medium` is the night setting. `VANTA_REASONING_BUDGET` and
# `VANTA_PRESENCE_PENALTY` were ABSENT in every night run, so they stay frozen to
# `unset`: the provider's own default is part of what those rows measure, and
# exporting either knob measures something else.
VANTA_REASONING_EFFORT = "medium"
VANTA_REASONING_BUDGET = "unset"
VANTA_PRESENCE_PENALTY = "unset"

# §14 — the audit switches. Absent in every night run, i.e. the binary's own `off`
# default (driver.rs reads each with a `false` default). Frozen to absence for the
# same reason as the two knobs above.
VANTA_CORROBORATE = "unset"
VANTA_GROUNDED_AUDIT = "unset"
VANTA_BATCH_AUDIT = "unset"
VANTA_ATTACKER_CONCISE = "unset"

# §14.15 — Vanta's own deadline. The harness derives and sets it itself
# (`RUN_TIMEOUT_SECS` 3 h minus a ten-minute margin), so the freeze is a guard on
# the caller, not the source of the child's value: a shell that exports a
# different deadline would end the run on a clock the rows do not describe.
VANTA_DEADLINE_SECS = "10200"

# §4.4 — the seed pinned on the request. `2` is the seed the night rows ran under.
VANTA_LLM_SEED = "2"

# The batch's spend ceiling. A cap that trips mid-run truncates the row, so the
# value is verdict-affecting and is frozen to the night setting.
VANTA_MAX_SPEND_USD = "5"

# The sandbox. `shuru` is the FORCED backend (`runner.vanta_env` sets it
# unconditionally); the freeze refuses a caller that tries to name another. The
# dependency self-heal needs network the VM does not have, so it is off.
VANTA_SANDBOX_BACKEND = "shuru"
VANTA_SHURU_AUTO_DEPS = "0"
VANTA_SHURU_DISK_MB = "16384"

# ---------------------------------------------------------------------------
# [recorded] — part of the configuration, observed at run time. Not frozen and not
# applied: a literal here would be a claim the harness cannot make true.
# ---------------------------------------------------------------------------
[recorded]
# The endpoint's own name and the server-side request knobs. Inherited from the
# caller on purpose — the harness must not invent a model or a tier — and carried
# into the row by `run.summary` (see the comment on each line).
VANTA_LLM_BASE_URL = "the invocation, not recorded (it names the server, not the model)"
VANTA_OPENAI_SERVICE_TIER = "run.summary sampling / the row's sampling block"
# §14.21 — the per-call-site output caps (`VANTA_MAX_TOKENS_<SITE>`, §14.20). A
# family of variables rather than one, so it cannot be a single frozen key; each
# site's effective cap is recorded in `run.summary`.
VANTA_MAX_TOKENS_SITE = "run.summary max_tokens_<role> / the row's sampling block"
# The per-bug sandbox tree. The checkpoint names the bug (`vanta-bi-<project>`) and
# the memory size is set only for the bugs prepare sized (pandas, 8192 MB), so
# neither is a value this file could freeze. `runner.vanta_env` sets both from the
# bug's own row, and the run log's `# env:` header records what it set.
VANTA_SHURU_CHECKPOINT = "set by runner.vanta_env from the bug (vanta-bi-<project>)"
VANTA_SHURU_MEMORY_MB = "set by runner.vanta_env from the row's prepare; absent = shuru's default"

# ---------------------------------------------------------------------------
# [prereg] — the pre-registration: what this configuration commits to before a
# run. A value of "recorded" means the run writes the observation into its own
# records (named in the comment) rather than this file freezing a literal.
# ---------------------------------------------------------------------------
[prereg]
# The model string the API returns on each response, and the sampling/effort as
# sent. The frozen literals are in [env] above; what is recorded per row is the
# AS-SENT value — the server may normalise it — including for `intent_audit`.
model = "recorded"
reasoning_effort = "recorded"
sampling = "recorded"
# §1.6.1 — the context selector's own file budget is a property of the binary's
# selector, not of this file; what is pre-registered is the window it was sized
# against (prepare.json's `n_ctx`, compared with the run's own by
# `runner.context_window_warning`).
file_selection_budget = "recorded"
context_window = "recorded"
# Item U — the harness's own `-o addopts=` neutralisation (harness.rs:2040): the
# repository's `addopts` is cleared for the generated test, because pandas'
# `setup.cfg` names an option only its own `conftest.py` registers. This is a
# property of the binary, frozen here as a statement that it is on.
neutralise_repo_addopts = true
# Item 2 — the project version prepare froze into the sandbox tree, so in-session
# `__version__` equals prepare's (prepare.json's per-bug `version_pin`).
version_pin = "recorded"
# The native suite whose regression gate the in-session run applies: the nodeids
# prepare recorded (prepare.json's `fail_to_pass`, `native_failure_baseline`), the
# count handed to `vanta_m3 --native-expected-tests` (M3 item W), and the split
# those came from.
native_suite_sha256 = "recorded"
native_expected_tests = "recorded"
split = "recorded"
split_sha256 = "recorded"
# The repair budget (M3 item 11).
#
# `max_attempts = 4` is MEASURED. Every night1/night2 invocation carries
# `--max-attempts 4` on its argv line (line 1 of each run log), so the budget is
# the one those rows actually ran under. The fixed-round arm's own count moved to
# `[fixed_rounds]` below, which — unlike this declarative section — the harness
# ENFORCES.
max_attempts = 4
# The split supplies each run's seed and the server's own seed is not pinned, so
# this file cannot guarantee one. Recorded rather than claimed.
seed = "not guaranteed by this file; the split supplies it and the row records it"

# ---------------------------------------------------------------------------
# [fixed_rounds] — the K arm's declaration (M3 item 9 / A5). ENFORCED.
# ---------------------------------------------------------------------------
# One entry per fixed-round arm: the arm's canonical name to the K it runs. This
# is the declaration of record, and it is here — rather than in `[prereg]` — for
# two reasons that are the whole point of the section:
#
#   * It is INSIDE the file's bytes, so changing K or the arm list moves
#     `config_hash`. A K arm's rows therefore cannot be pooled with a batch run
#     under a different K, which is what `seed_policy`'s rule requires of any
#     setting that changes the meaning of a verdict.
#   * It is READ, not merely stated: `bugsinpy_run.py` passes this table to
#     `runner.run_batch`, which refuses a run whose scheduled K arm is absent from
#     it or is declared at a different K. `[prereg]` (which the harness never
#     applies) could not refuse anything.
#
# K = 4 is the M3 plan's Phase-3 value, cited rather than chosen. §6.4 says
# "Fixed rounds K: 4, matching the default attempt budget"; §6.1 names the arms
# that spend it ("B3 fixed-rounds K = 4 + B1 fixed-rounds K = 4"). The night
# smokes passed no `--fixed-rounds`, so they ran normal mode; they are not the K
# arm, and this table is not a claim about them. The plan's §14 still asks
# "Fixed-round K: 4 to match the attempt budget, or more?" — that open question is
# why K is a field here and not a constant in the code.
#
# [VANTA-WHY] `scripts/bugsinpy/arms.py` mirrors this table as `Arm.fixed_rounds`,
# and a test binds the two (`TestArms::test_the_fixed_round_arms_match_the_frozen_config`):
# a hand-edit on either side fails the suite, so the registry cannot describe a K
# arm the configuration does not declare, nor the reverse.
[fixed_rounds]
b1-k4 = 4
b3-k4 = 4

# ---------------------------------------------------------------------------
# [prompts] — the SHA-256 of every prompt TEMPLATE. Each value is the 12-hex
# `prompt_content_hash` of that role's system and user templates, joined by U+001F
# in a fixed order: the role's system templates first, then its user templates.
#
# Every role `pipeline::prompt_hashes()` records is here, plus `judge`: the judge's
# prompt is sent only on a judge arm, so it cannot go in that every-row string
# (every row, `session.start` included, carries it), but its text is a prompt the
# binary sends and so it is recorded here, where an edit moves `config_hash`.
#
# [VANTA-WHY] Item 16 reordered a USER prompt and this block did not move, because
# it hashed the system prompts only — so `config_hash` described a configuration
# whose prompt text was no longer the text the binary sent. The user templates are
# covered here now, the judge's included (C4: the judge's user blocks used to be
# inline at the call site). The tie to the code is a test, not a convention:
# `pipeline::tests::the_committed_prompts_block_is_the_hash_of_the_templates_this_code_sends`
# (in `src/pipeline/mod.rs`) recomputes each value from the templates the call sites
# expand, so a template edit fails the suite until this block is updated, and
# updating it changes the file's bytes — and therefore every row's `config_hash`.
# ---------------------------------------------------------------------------
[prompts]
attacker = "e9a69cc76c42"
intent_check = "600220339e14"
creator = "70003e722ca6"
# The Diagnostician is rule-based and sends no prompt of its own (its Unknown path
# sends the Attacker's simplify prompt, already covered above), so there is no
# prompt text to hash. The slot is `not_applicable` rather than the hash of the
# empty set (`e3b0c44298fc`, the SHA-256 of ""), which would be indistinguishable
# from a real prompt that had been truncated.
diagnostician = "not_applicable"
# The judge's system prompt AND its user blocks / retry tail, from the one accessor
# the judge row's `judge_prompt_hash` also reads (`agents::judge::judge_prompt_hash`).
judge = "5462ccc08255"
