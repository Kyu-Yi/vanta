[package]
name = "vanta"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.9"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2"
octocrab = "0.54.5"
# [VANTA-WHY] Only for the prompt-provenance hash (`core::prompt_content_hash`):
# the first 12 hex characters of the SHA-256 of each role's system prompt, so a
# wording change that forgot to bump a version label still shows in the logs.
# Already in the lock file as a transitive dependency of `octocrab`, so this adds
# no new download or version resolution.
sha2 = "0.10"

[dev-dependencies]
# [VANTA-WHY] `test-util` (NOT part of tokio's `full`) provides
# `tokio::time::pause`, which the streaming tests need: they assert a stream that
# keeps delivering tokens for 700 SIMULATED seconds completes while one that goes
# quiet is abandoned after the idle timeout. Real time made those untestable —
# nobody waits 700 real seconds in a test suite.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
